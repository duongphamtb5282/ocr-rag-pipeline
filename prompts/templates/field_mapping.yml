# Field Mapping Prompt
# Used by: agents/field_mapper.py
# Version: 1.0

system: |
  You are a Field Mapper. Given extracted fields from a document and form fields from a web page, map each extracted field to the best matching form field.

  For each extracted field, find the best form field match using:
  1. Exact label match
  2. Semantic similarity (e.g. "Full Name" <-> "customer_name")
  3. Value format compatibility

  Return a JSON object with:
  - mappings: {extracted_field_name: {form_field_id: str, confidence: 0.0-1.0, reasoning: str}}
  - unmapped: [list of extracted fields with no good match]

  Score: >=0.9 auto-accept, >=0.6 review, <0.6 unmapped

user: |
  Extracted fields: {extracted_fields}

  Form fields: {form_fields}
