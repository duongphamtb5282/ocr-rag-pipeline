<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Documents</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <nav class="nav">
    <span class="brand">OCR Form Fill</span>
    <a href="/">Upload</a>
    <a href="/history">History</a>
    <a href="/search">Search</a>
    <a href="/admin">Admin</a>
  </nav>
  <div class="container">
    <h1 style="margin: 2rem 0 0.5rem;">Semantic Search</h1>
    <p style="color: var(--gray-700); margin-bottom: 1rem;">Search across all processed documents by content.</p>

    <div class="card" style="display:flex; gap:0.5rem;">
      <input type="text" id="searchInput" placeholder='e.g. "invoices over $1000 from Acme"' style="flex:1; padding:0.75rem; border:1px solid var(--gray-200); border-radius:0.375rem;">
      <button class="btn btn-primary" onclick="search()">Search</button>
    </div>

    <div id="searchResults"></div>
  </div>
  <script>
    async function search() {
      const q = document.getElementById('searchInput').value;
      const resultsDiv = document.getElementById('searchResults');
      if (!q.trim()) { resultsDiv.innerHTML = '<p style="color:var(--gray-700);">Enter a search query.</p>'; return; }

      resultsDiv.innerHTML = '<p class="badge badge-info">Searching...</p>';
      try {
        const resp = await fetch(`/api/v1/search?q=${encodeURIComponent(q)}&limit=20`);
        const results = await resp.json();
        if (results.length === 0) {
          resultsDiv.innerHTML = '<div class="card"><p>No results found.</p></div>';
          return;
        }
        resultsDiv.innerHTML = results.map(r => `
          <div class="card">
            <div style="display:flex; justify-content:space-between;">
              <div>
                <p><strong>${r.doc_type || 'Unknown'}</strong> <span class="badge badge-info">${r.session_id.slice(0,8)}...</span></p>
                <p style="font-size:0.875rem; color:var(--gray-700);">${Object.entries(r.extracted_fields || {}).slice(0,5).map(([k,v]) => `${k}: ${v.value}`).join(' | ')}</p>
              </div>
              <span class="badge badge-success">Similarity: ${(r.similarity * 100).toFixed(0)}%</span>
            </div>
          </div>
        `).join('');
      } catch (e) {
        resultsDiv.innerHTML = `<p class="badge badge-danger">Error: ${e.message}</p>`;
      }
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') search(); });
  </script>
</body>
</html>
