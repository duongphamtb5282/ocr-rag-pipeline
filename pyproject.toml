[project]
name = "ocr-form-fill"
version = "0.1.0"
description = "OCR Form Fill System — Upload docs, extract fields, auto-fill web forms"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langgraph>=0.1.0",
    "playwright>=1.40.0",
    "pdfplumber>=0.10.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.9.0",
    "Pillow>=10.0.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "jinja2>=3.1.2",
    "aiofiles>=23.2.0",
    "sse-starlette>=1.8.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "numpy>=1.26.0",
    "python-magic>=0.4.27",
    "validators>=0.22.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.11",
    "mypy>=1.7.1",
]
doctr = ["python-doctr>=0.8.0", "torch>=2.1.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "agents*", "api*", "components*", "graph*", "prompts*", "security*", "services*", "tools*", "web*", "evaluation*", "observability*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
